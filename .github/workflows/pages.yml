name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Prepare site
        run: |
          mkdir "$RUNNER_TEMP/site"
          rsync -a \
            --exclude-from .pagesignore \
            ./ "$RUNNER_TEMP/site/"
          mkdir -p "$RUNNER_TEMP/site/dark-arts/assets/_unused"
          cp dark-arts/assets/_unused/dark-art-open-spread.png \
            "$RUNNER_TEMP/site/dark-arts/assets/_unused/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
